าง":"Close"))))},APP_VERSION="v1.5.1",changelogData=[{version:"v1.5.1",date:"October 26, 2026",dateTh:"26 ตุลาคม 2569",features:["Renamed to Adult DM Guide.","NLEM filter moved next to the FDA registration filter (shown while Thailand is selected), as in the Bronchodilator Guide.","Pictures for 15 more drugs from written product descriptions: 6 tablets (Glucophage, Glucophage XR/SR, Minidiab, Diamicron MR, Amaryl, Daonil) from UK, Dutch, Australian and New Zealand product information, and 9 pens (Trulicity, Mounjaro, Humalog, Humulin N, Humulin 70/30, Humalog Mix 75/25, Lantus, Tresiba, Soliqua) from their instructions for use; parts a label does not describe are drawn as an outline. Ozempic, Victoza, Actrapid/Humulin R, Toujeo and Xultophy stay N/A (no colour in any label checked).","Five new drug cards for guideline drugs registered in Thailand: mitiglinide (Glufast), gemigliptin (Zemiglo), alogliptin (Nesina), canagliflozin (Invokana) and tirzepatide (Mounjaro), from CPG 2566, the product labels and the Thai FDA register. Price level is N/A until checked.","Countries filter (All, TH, US, UK, EU, JP) and an FDA registration filter (Currently, † Past, ⊘ Never), as in the Bronchodilator Guide. Default: currently registered in Thailand.","Cards and list rows show a coloured chip per country: the Thai licence holder or an example product, † if registration was cancelled or discontinued, ⊘ if not found.","Drug details: new Registration by country section (Thai FDA register numbers and licence holders, and US FDA, UK NHS dm+d, EU EMA/HPRA and Japan PMDA status with examples and sources).","Kidney limits follow CPG 2566 (Table 2, p. 100): dapagliflozin is not used if eGFR < 25 and empagliflozin if eGFR < 20, on the cards, in the detail view and in the kidney tool. Sitagliptin: 50 mg if eGFR 30-50, 25 mg if < 30.","NLEM status follows the National List of Essential Medicines B.E. 2569 and its codes (b basic, ex exclusive), with each listing's conditions. Metformin XR, gliclazide MR, glimepiride, acarbose, DPP-4 and SGLT2 inhibitors, GLP-1 receptor agonists, degludec, glargine U300 and the fixed combinations are not in it; repaglinide, aspart/lispro, their premixes and glargine U100 are listed as ex.","A1C lowering values follow CPG 2566 Table 1 (sulfonylureas 1-2%, DPP-4 and SGLT2 inhibitors 0.8%, GLP-1 receptor agonists 1-1.5%).","Removed a pioglitazone dose note that the guideline does not contain; added the Ozempic 2 mg pen, which is registered in Thailand.","Brands without a current Thai FDA registration are marked († cancelled, ‡ not found under that name); NovoNorm, Victoza and Glucobay are tagged No current Thai registration.","Drug pictures now come only from written product descriptions (US or EU labels): 12 tablets are drawn in their described colour and shape, and the detail view names the product shown. Drugs with no checked description, and all pens and vials (labels give no colours), show N/A.","Show sources button in the drug detail view: each section lists the guideline table, the NLEM 2569 list and the product label behind it, or says No source recorded.","Thai FDA registration numbers in the drug detail view, each linked to its register record.","New layout matching the Bronchodilator Guide: large title with author and disclaimer link, round version/language/theme buttons, colour guide buttons (two rows of icon tiles on phones), one search/sort/view/Filters row pinned while scrolling, compact filter groups, removable filter chips and a result count.","Drug cards: picture, Select and Details at the top right, class and NLEM tags, ASCVD/HF/CKD badges, a facts box (A1C, weight, hypoglycaemia, kidney, forms, starting dose) and the max dose as the card footer. A click anywhere on a card opens its details.","List view: compact rows with the key facts (replaces the table).","Drug details: one scrolling view of colour-coded sections that fold (dosing, kidney and liver, benefits, safety, Ramadan and pregnancy, patient advice, mechanism), with Expand all / Collapse all; the folds are remembered on this device. Hypoglycaemia risk detail is now shown.","Compare bar at the bottom of the screen; a disclaimer section above the references.","English mode now covers all ten tools (start wizard, insulin, kidney dosing, hypoglycaemia, DKA/HHS, Ramadan, Thai DRS, diabetic foot, GDM, remission): every heading, step, table and result is in English, including the guideline tables they use.","New pictures for the ten tool buttons and their windows: capsule (start drugs), syringe (insulin), kidney, falling blood drop (hypoglycaemia), IV drip (DKA/HHS), crescent and star (Ramadan), risk gauge (Thai DRS), footprint (diabetic foot), pregnant woman (GDM) and falling trend (remission).","Hypoglycaemia tool: on phones the tab row now scrolls, so the third tab (severe hypoglycaemia, IV / glucagon) can be reached.","Phone layout: long drug names on cards now wrap onto a second line instead of being cut off.","Language button shows ไทย / EN as plain text (flag emoji showed as letters on Windows).","Shorter search box hint so it fits on a phone screen.","English mode: card badges, compare button and monograph labels now in English.","English versions of every drug's renal dosing by CKD stage, hepatic dosing, weight effect, hypoglycaemia detail, pregnancy/lactation and patient advice (all 31 drugs), plus English Benefits, Safety, Ramadan and Advice tabs.","Renal dosing rows stack on phones so long advice is not squeezed.","Sitagliptin and rapid-acting insulin: CKD 3a/3b rows now state the eGFR < 50 cut-off clearly instead of quoting a range that did not match the row."],featuresTh:["เปลี่ยนชื่อเป็น Adult DM Guide","ย้ายตัวกรองบัญชียาหลักไปไว้ข้างตัวกรองทะเบียน อย. (แสดงเมื่อเลือกประเทศไทย) แบบเดียวกับ Bronchodilator Guide","เพิ่มภาพยาอีก 15 รายการจากคำบรรยายลักษณะยา: ยาเม็ด 6 รายการ (Glucophage, Glucophage XR/SR, Minidiab, Diamicron MR, Amaryl, Daonil) จากเอกสารกำกับยาของสหราชอาณาจักร เนเธอร์แลนด์ ออสเตรเลีย และนิวซีแลนด์ และปากกา 9 รายการ (Trulicity, Mounjaro, Humalog, Humulin N, Humulin 70/30, Humalog Mix 75/25, Lantus, Tresiba, Soliqua) จากวิธีใช้ปากกา ส่วนที่ฉลากไม่ระบุสีวาดเป็นเส้นขอบ; Ozempic, Victoza, Actrapid/Humulin R, Toujeo และ Xultophy ยังเป็น N/A (ไม่มีฉลากใดระบุสี)","เพิ่มการ์ดยา 5 รายการตามแนวทางที่มีทะเบียนในไทย: mitiglinide (Glufast), gemigliptin (Zemiglo), alogliptin (Nesina), canagliflozin (Invokana) และ tirzepatide (Mounjaro) จาก CPG 2566 เอกสารกำกับยา และทะเบียนยา อย. ระดับราคาเป็น N/A จนกว่าจะตรวจสอบ","ตัวกรองประเทศ (ทั้งหมด, TH, US, UK, EU, JP) และตัวกรองทะเบียน อย. (ปัจจุบัน, † เคยมี, ⊘ ไม่เคยมี) แบบเดียวกับ Bronchodilator Guide ค่าเริ่มต้น: มีทะเบียนในไทยปัจจุบัน","การ์ดและรายการแสดงชิปสีตามประเทศ: ผู้รับอนุญาตในไทยหรือตัวอย่างผลิตภัณฑ์, † ถ้าทะเบียนถูกยกเลิกหรือเลิกจำหน่าย, ⊘ ถ้าไม่พบ","รายละเอียดยา: เพิ่มหัวข้อทะเบียนยาในแต่ละประเทศ (เลขทะเบียนและผู้รับอนุญาตในไทย และสถานะใน US FDA, UK NHS dm+d, EU EMA/HPRA, ญี่ปุ่น PMDA พร้อมตัวอย่างและแหล่งที่มา)","เกณฑ์การใช้ยาในโรคไตตาม CPG 2566 (ตารางที่ 2 และหน้า 100): ไม่ใช้ dapagliflozin ถ้า eGFR < 25 และไม่ใช้ empagliflozin ถ้า eGFR < 20 ทั้งในการ์ด หน้ารายละเอียด และเครื่องมือโรคไต; sitagliptin 50 มก. ถ้า eGFR 30-50 และ 25 มก. ถ้า < 30","สถานะบัญชียาหลักตามบัญชียาหลักแห่งชาติ พ.ศ. 2569 และรหัสบัญชีย่อย (b บัญชียาพื้นฐาน, ex บัญชียาเฉพาะโรค) พร้อมเงื่อนไขการใช้ metformin XR, gliclazide MR, glimepiride, acarbose, DPP-4 inhibitors, SGLT2 inhibitors, GLP-1 RA, degludec, glargine U300 และยาผสมคงที่ไม่อยู่ในบัญชี; repaglinide, aspart/lispro, ยาผสมสำเร็จรูปของทั้งสอง และ glargine U100 อยู่ในบัญชี ex","ประสิทธิภาพลด A1C ตาม CPG 2566 ตารางที่ 1 (sulfonylurea 1-2%, DPP-4 และ SGLT2 inhibitors 0.8%, GLP-1 RA 1-1.5%)","ตัดข้อความเรื่องขนาดยา pioglitazone ที่ไม่มีในแนวทางเวชปฏิบัติ; เพิ่มปากกา Ozempic 2 มก. ที่มีทะเบียนในไทย","ทำเครื่องหมายชื่อการค้าที่ไม่พบทะเบียนยา อย. ที่ยังคงอยู่ († ทะเบียนถูกยกเลิก, ‡ ไม่พบภายใต้ชื่อนี้) และติดป้าย ไม่พบทะเบียนยาในไทยที่ยังคงอยู่ ที่ NovoNorm, Victoza และ Glucobay","ภาพยามาจากคำบรรยายลักษณะยาในเอกสารกำกับยา (สหรัฐฯ หรือยุโรป) เท่านั้น: วาดเม็ดยา 12 รายการตามสีและรูปร่างที่ระบุ และหน้ารายละเอียดระบุชื่อผลิตภัณฑ์ที่แสดง ยาที่ไม่พบคำบรรยาย รวมถึงปากกาและขวดยาทุกชนิด (ฉลากไม่ระบุสี) แสดงเป็น N/A","ปุ่มแสดงแหล่งที่มาในหน้ารายละเอียดยา: แต่ละหมวดระบุตารางในแนวทางเวชปฏิบัติ บัญชียาหลักแห่งชาติ 2569 และเอกสารกำกับยาที่ใช้อ้างอิง หรือระบุว่ายังไม่มีแหล่งอ้างอิงที่ตรวจสอบแล้ว","เลขทะเบียนยา อย. ในหน้ารายละเอียดยา พร้อมลิงก์ไปยังข้อมูลทะเบียนแต่ละรายการ","หน้าตาใหม่แบบเดียวกับ Bronchodilator Guide: ชื่อแอปขนาดใหญ่พร้อมชื่อผู้จัดทำและลิงก์ข้อจำกัดความรับผิดชอบ ปุ่มกลมสำหรับเวอร์ชัน/ภาษา/ธีม ปุ่มเครื่องมือสี (บนโทรศัพท์เป็นไอคอน 2 แถว) แถวค้นหา/เรียง/มุมมอง/ตัวกรองที่ค้างอยู่ด้านบนเมื่อเลื่อน กลุ่มตัวกรองแบบกะทัดรัด ป้ายตัวกรองที่กดเอาออกได้ และจำนวนผลลัพธ์","การ์ดยา: รูปยา ปุ่มเลือกและรายละเอียดที่มุมขวาบน ป้ายกลุ่มยาและ NLEM ป้าย ASCVD/HF/CKD กล่องข้อมูลสำคัญ (A1C น้ำหนัก น้ำตาลต่ำ ไต รูปแบบยา ขนาดเริ่มต้น) และขนาดยาสูงสุดที่ท้ายการ์ด กดที่ใดก็ได้บนการ์ดเพื่อเปิดรายละเอียด","มุมมองรายการ: แถวกะทัดรัดพร้อมข้อมูลสำคัญ (แทนตาราง)","รายละเอียดยา: หน้าเดียวเลื่อนดูได้ แบ่งเป็นหมวดสีที่พับเก็บได้ (ขนาดยา ไตและตับ ประโยชน์ ความปลอดภัย รอมฎอนและการตั้งครรภ์ คำแนะนำผู้ป่วย กลไกการออกฤทธิ์) พร้อมปุ่มขยาย/ย่อทั้งหมด และจำการพับไว้ในเครื่องนี้ เพิ่มรายละเอียดความเสี่ยงน้ำตาลต่ำ","แถบเปรียบเทียบที่ด้านล่างจอ และหมวดข้อจำกัดความรับผิดชอบก่อนเอกสารอ้างอิง","โหมดภาษาอังกฤษครอบคลุมเครื่องมือทั้ง 10 รายการ (เริ่มยา อินซูลิน ยาในโรคไต น้ำตาลต่ำ DKA/HHS รอมฎอน Thai DRS เท้าเบาหวาน GDM ระยะสงบ): หัวข้อ ขั้นตอน ตาราง และผลลัพธ์ทั้งหมดเป็นภาษาอังกฤษ รวมถึงตารางแนวทางเวชปฏิบัติที่ใช้","ไอคอนใหม่ของปุ่มเครื่องมือทั้ง 10 และหน้าต่างของแต่ละเครื่องมือ: แคปซูลยา (เริ่มยา) กระบอกฉีดยา (อินซูลิน) ไต หยดเลือดลูกศรลง (น้ำตาลต่ำ) ถุงน้ำเกลือ (DKA/HHS) จันทร์เสี้ยวและดาว (รอมฎอน) มาตรวัดความเสี่ยง (Thai DRS) รอยเท้า (เท้าเบาหวาน) หญิงตั้งครรภ์ (GDM) และกราฟลดลง (ระยะสงบ)","เครื่องมือภาวะน้ำตาลต่ำ: บนโทรศัพท์แถบแท็บเลื่อนได้ จึงเปิดแท็บที่ 3 (ภาวะน้ำตาลต่ำรุนแรง IV / glucagon) ได้","หน้าจอโทรศัพท์: ชื่อยายาวบนการ์ดขึ้นบรรทัดใหม่ ไม่ถูกตัดหาย","ปุ่มสลับภาษาแสดงเป็น ไทย / EN (ธงชาติแสดงเป็นตัวอักษรบน Windows)","ข้อความในช่องค้นหาสั้นลง พอดีกับหน้าจอโทรศัพท์","โหมดภาษาอังกฤษ: ป้ายบนการ์ด ปุ่มเปรียบเทียบ และหัวข้อในหน้ารายละเอียดยาเป็นภาษาอังกฤษ","เพิ่มข้อมูลภาษาอังกฤษของยาทั้ง 31 ชนิด: การปรับยาตามระยะโรคไต การปรับยาในโรคตับ ผลต่อน้ำหนัก ความเสี่ยงน้ำตาลต่ำ การตั้งครรภ์/ให้นมบุตร และคำแนะนำผู้ป่วย พร้อมแท็บประโยชน์ ความปลอดภัย รอมฎอน และคำแนะนำเป็นภาษาอังกฤษ","แถวการปรับยาตามระยะโรคไตเรียงซ้อนบนโทรศัพท์ ข้อความไม่ถูกบีบ","Sitagliptin และอินซูลินออกฤทธิ์เร็ว: แถว CKD 3a/3b ระบุจุดตัด eGFR < 50 ให้ชัดเจน แทนช่วงค่าที่ไม่ตรงกับแถว"]},{version:"v1.2.0",date:"October 23, 2026",dateTh:"23 ตุลาคม 2569",features:["Combined Categories & Drug Class accordion filter: clicking on Oral Agents, GLP-1 RA, Insulins, or Combinations expands to reveal its specific drug classes (Biguanides, SUs, DPP-4i, SGLT-2i, TZDs, Basal insulins, etc.).","Rich high-fidelity drug pictures & device SVGs: custom pharmaceutical illustrations for scored oral tablets, prefilled insulin/GLP-1 pens with brand-accurate color caps, and glass vials.","Bronchodilator-style card layout: 'Select' compare button pinned to top-right corner, with 'Details' button directly below it.","Prominent Max Dose (ขนาดยาสูงสุด) badge on all 31 drug cards, detailed monographs, and compare tables based on Thai CPG 2566.","Collapsible 'Filters' toggle button with active filter counter badge.","Dark mode textbox & select styling overhaul: eliminated high-contrast clipping, native select dropdown dark palette, and seamless input borders.","Collapsible References tab at the bottom with 8 authoritative guidelines and citations (CPG 2566, ADA 2024, KDIGO, IDF-DAR, NLEM, Thai DRS)."],featuresTh:["รวมหมวดหมู่และกลุ่มยาเป็นระบบ Accordion: เมื่อกดเลือกหมวดหมู่ (ยากิน, GLP-1 RA, อินซูลิน, ยาผสม) จะขยายแสดงกลุ่มยาย่อยทันที เช่น Biguanide, Sulfonylurea, DPP-4i, SGLT-2i, Basal insulin","ภาพจำลองยาและอุปกรณ์ฉีดคุณภาพสูง (Drug Pictures SVG): ออกแบบเม็ดยาพร้อมรอยบากตามกลุ่มยา, ปากกาอินซูลิน/GLP-1 ระบุสีปลอกและปุ่มกดตามยี่ห้อจริง, และขวดยาฉีด 10 มล.","จัดวางปุ่มบนการ์ดยาตามแบบ Bronchodilator Guide: ย้ายปุ่ม 'เลือก' (Select) ไปมุมบนขวา และปุ่ม 'รายละเอียด' (Details) อยู่ด้านล่างตรงกันพอดี","แสดง 'ขนาดยาสูงสุด' (Max Dose) อย่างชัดเจนบนการ์ดยาทุกใบ พร้อมกรอบเน้นสีอำพันและในหน้าต่างเปรียบเทียบ","ปุ่มเปิด-ปิดตัวกรอง (Filters Button) พร้อมตัวเลขแสดงจำนวนตัวกรองที่เปิดใช้งานอยู่","ปรับปรุงกล่องข้อความค้นหาและเมนูเลือกในโหมดมืด (Dark Mode): สีกลมกลืน ไม่ตัดกันจนแสบตา และเมนูตัวเลือกแสดงผลคมชัด","แถบเอกสารอ้างอิงแบบพับเก็บได้ (Collapsible References Tab) ด้านล่างสุด รวบรวมแนวทางเวชปฏิบัติหลัก 8 ฉบับ"]},{version:"v1.1.0",date:"October 20, 2026",dateTh:"20 ตุลาคม 2569",features:["10 Interactive Clinical Guideline Modules based on Thai CPG 2566: Starting Drug Wizard (Diagram 1 & 2), Insulin Titration Calculator, CKD Renal Dose Matrix, Hypoglycemia Rule of 15 Countdown, DKA/HHS Emergency Resuscitation, Ramadan Fasting Assessment, Thai DRS 10-Yr Diabetes Risk Score, Diabetic Foot Ipswich Touch Test, Gestational Diabetes (GDM), and Diabetes Remission Protocol.","Full bilingual Thai and English interface across all tools, tables, and monographs."],featuresTh:["เพิ่มเครื่องมือแนวทางเวชปฏิบัติ CPG 2566 ครบทั้ง 10 โมดูล: แผนภูมิ 1 และ 2 การเริ่มยา, เครื่องคำนวณและปรับขนาดอินซูลิน, ตารางปรับยาในโรคไต (eGFR), ตัวจับเวลาภาวะน้ำตาลต่ำ Rule of 15, เครื่องช่วยฟื้นคืนชีพ DKA/HHS, การประเมินรอมฎอน, แบบประเมินความเสี่ยง Thai DRS, การตรวจเท้า Ipswich touch test, เบาหวานขณะตั้งครรภ์ GDM, และแนวทางเบาหวานระยะสงบ (Remission)","รองรับสองภาษา (ไทยและอังกฤษ) อย่างสมบูรณ์ในทุกหน้าจอและทุกฐานข้อมูลยา"]},{version:"v1.0.0",date:"October 15, 2026",dateTh:"15 ตุลาคม 2569",features:["Initial launch of DM Guide 2566 with 31 anti-diabetic medications in Thailand.","Renal dose adjustment thresholds, CV/HF/CKD organoprotective indications, and head-to-head comparison dock."],featuresTh:["เปิดตัวแอปพลิเคชัน DM Guide 2566 พร้อมฐานข้อ
